# aws cloudformation deploy --stack-name rds-mysql --template-file exercises/rds.yaml --parameter-overrides DBPassword=Masterkey123
# aws cloudformation delete-stack --stack-name rds-mysql
Description: Simple RDS MySQL (Free Tier eligible)

Parameters:
  EnvId:
    Type: String
    Default: project
    Description: Tag value for Application

  DBUsername:
    Type: String
    Default: admin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: Master username (starts with a letter; alphanumeric/underscore)

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Description: Master user password

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: Instance class (db.t3.micro / db.t4g.micro are Free Tier eligible)

  AllowedCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: Optional CIDR (e.g., 203.0.113.0/24) allowed to access MySQL (3306). Leave empty to disable inbound.

  PubliclyAccessible:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Whether the DB instance should have a public IP

Resources:
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL access
      VpcId:
        Fn::ImportValue: !Sub "${EnvId}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

  DbSgIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      CidrIp: !Ref AllowedCidr

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for MySQL
      SubnetIds:
        - Fn::ImportValue: !Sub "${EnvId}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${EnvId}-PublicSubnet2Id"
        - Fn::ImportValue: !Sub "${EnvId}-PublicSubnet3Id"
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: "20"
      StorageType: gp2
      MultiAZ: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      Port: 3306
      BackupRetentionPeriod: 1
      StorageEncrypted: false
      DeletionProtection: false
      PubliclyAccessible: !Ref PubliclyAccessible
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

Outputs:
  DBInstanceEndpoint:
    Description: Database endpoint address
    Value: !GetAtt DbInstance.Endpoint.Address
    Export:
      Name: !Sub "${EnvId}-DBInstanceEndpoint"

  DBInstancePort:
    Description: Database endpoint port
    Value: !GetAtt DbInstance.Endpoint.Port
    Export:
      Name: !Sub "${EnvId}-DBInstancePort"

  DBInstanceId:
    Description: DB instance identifier
    Value: !Ref DbInstance
    Export:
      Name: !Sub "${EnvId}-DBInstanceId"

  DBSecurityGroupId:
    Description: DB security group ID
    Value: !Ref DbSecurityGroup
    Export:
      Name: !Sub "${EnvId}-DBSecurityGroupId"